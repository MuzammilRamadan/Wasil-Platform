<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> wasil - Choose Language</title>
    <link rel="stylesheet" href="../Css files/wasil-language.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="lang-container">
        <div class="lang-card">
            <div class="lang-title" data-i18n="lang.title">Choose Your Language</div>
            <div class="lang-buttons">
                <!-- Use lang-select-btn (not lang-btn) to avoid conflict with i18n toggle code -->
                <button class="lang-select-btn" id="btn-en" data-i18n="lang.english">English</button>
                <button class="lang-select-btn" id="btn-ar" data-i18n="lang.arabic">العربية</button>
            </div>
        </div>
    </div>
    <!-- Load i18n FIRST so applyLanguage() runs and translates the title -->
    <script src="../Js files/wasil-i18n.js"></script>
    <script src="../Js files/wasil-language.js"></script>
</body>

</html>
